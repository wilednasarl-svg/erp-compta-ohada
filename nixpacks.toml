# Nixpacks build plan override.
#
# Canonical source of truth for the Railway build pipeline. Without this
# file, Nixpacks performs TWO installs (a cached one with default flags,
# then our buildCommand). The cached install respects the runtime
# `NODE_ENV=production` Railway propagates → skips devDependencies →
# `rimraf`, `@nestjs/cli`, `tsc` are missing → the next install can't
# fix things because the cache volume `node_modules/.cache` is mounted
# read-only and `rm -rf` chokes on it (`Device or resource busy`).
#
# By overriding `[phases.install]` here we run a SINGLE install with
# `--prod=false`, devDependencies land on the first try, the cache
# stays intact, and the build proceeds cleanly.

providers = ["node"]

[phases.setup]
# Node 20 is what `engines.node` in apps/backend/package.json requires.
# Pinning here too belt-and-braces against a Nixpacks heuristic change.
# Pnpm 9 matches our committed pnpm-lock.yaml v9.0 format.
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
# `--prod=false` keeps devDependencies even when `NODE_ENV=production`
# is in the build env (Railway runtime var leaks into the build). We
# need rimraf / @nestjs/cli / tsc for `nest build` to run.
cmds = ["pnpm install --frozen-lockfile --prod=false"]

[phases.build]
# Single `pnpm build` filtered to the backend workspace. The frontend
# is deployed separately on Vercel, no reason to build it here.
cmds = ["pnpm --filter backend build"]

[start]
# `apps/backend/dist/main.js` is the entry produced by `nest build`
# (see backend package.json `"main"` + `"build"` scripts).
cmd = "node apps/backend/dist/main.js"
