# CI pipeline for the ERP Compta monorepo.
#
# Backend + Frontend gates run on every PR targeting `main` and every push
# to `main`. A new push to the same branch cancels the in-progress run so
# we never waste CI minutes on a superseded commit.
#
# Jobs share NO state — each one re-resolves the pnpm store from the cache
# and runs `pnpm install --frozen-lockfile`. The cache key is keyed on
# `pnpm-lock.yaml` so a lockfile change invalidates every job; a
# source-only change re-uses the same store across jobs.
#
# To enforce this pipeline as a merge gate:
#   Settings -> Branches -> Branch protection rules -> `main`
#     -> Require status checks to pass before merging
#     -> Select ONLY: ci / ci-gate
#   (ci-gate aggregates every blocking job below; it is the single
#   required check.)
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ─── Backend gates ───────────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `test:cov` runs the unit suite AND enforces the 80% coverage
      # threshold pinned in apps/backend/package.json `jest.coverageThreshold`.
      # A drop below 80% fails the job — no separate coverage step needed.
      - run: pnpm --filter backend test:cov

  build-backend:
    name: build-backend
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend build
      # Persist the dist/ output for the api-types-sync job so we don't
      # rebuild from scratch (saves ~30s).
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          retention-days: 1

  # ─── Frontend gates ──────────────────────────────────────────────────
  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint

  typecheck-frontend:
    name: typecheck-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend typecheck

  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    needs: typecheck-frontend
    env:
      # next.config.mjs reads NEXT_PUBLIC_API_BASE_URL at build time and
      # bakes it into the bundle. Without this, the build would inline the
      # localhost fallback — fine for CI artifacts, but make it explicit.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      # Persist .next so bundle-size doesn't rebuild from scratch.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-next
          path: apps/frontend/.next
          retention-days: 1

  bundle-size:
    name: bundle-size
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: frontend-next
          path: apps/frontend/.next
      - run: pnpm --filter frontend size

  # ─── Contract sync gate ──────────────────────────────────────────────
  # Boots the backend in the background, regenerates the frontend's
  # openapi.types.ts from /docs-json, and fails if the result differs
  # from the committed version. This forces the dev to commit the
  # regenerated types whenever the backend contract moves.
  api-types-sync:
    name: api-types-sync
    runs-on: ubuntu-latest
    needs: build-backend
    env:
      PORT: '3001'
      # NOTE: NODE_ENV is set per-step (only on `start:prod`), NOT at job
      # level. If we set NODE_ENV=production here, `pnpm install` would
      # skip devDependencies and `openapi-typescript` would go missing
      # in the regenerate step. See nixpacks.toml for the matching prod
      # override (`--prod=false`).
      #
      # Minimal env the backend needs to boot enough to serve /docs-json.
      # Values are deterministic CI-only secrets — nothing here grants
      # access to anything real. MFA_ENCRYPTION_KEY must decode to exactly
      # 32 bytes (base64); SMTP_* are required by env.validation.ts even
      # though the api-types-sync job never sends mail (EMAIL_DRY_RUN=true).
      JWT_SECRET: ci-only-jwt-secret-not-used-in-prod-32b
      MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_compta_ci
      DB_SSL: 'false'
      APP_BASE_URL: http://localhost:3000
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: '587'
      SMTP_USER: ci-user
      SMTP_PASS: ci-pass
      SMTP_FROM: ci@example.invalid
      EMAIL_DRY_RUN: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_compta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_compta_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
      - name: Start backend in background
        # NODE_ENV=production only here — the install step above runs
        # with the default NODE_ENV so devDependencies (openapi-typescript)
        # land in node_modules/.bin for the regenerate step below.
        env:
          NODE_ENV: production
        run: |
          pnpm --filter backend start:prod > backend.log 2>&1 &
          echo $! > backend.pid
      - name: Wait for /docs-json
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/docs-json > /dev/null; then
              echo "Backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Backend never served /docs-json — log dump:"
          cat backend.log || true
          exit 1
      - name: Regenerate openapi.types.ts
        run: pnpm --filter frontend generate:api-types
      - name: Fail if openapi.types.ts is out of sync
        run: |
          if ! git diff --exit-code apps/frontend/src/lib/api/openapi.types.ts; then
            echo ""
            echo "ERROR: openapi.types.ts is out of sync with the backend OpenAPI contract."
            echo "Run locally:"
            echo "  pnpm --filter backend start:dev   # in a separate terminal"
            echo "  pnpm --filter frontend generate:api-types"
            echo "  git add apps/frontend/src/lib/api/openapi.types.ts && git commit"
            exit 1
          fi
      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi

  # ─── E2E (non-blocking, kept as-is) ──────────────────────────────────
  e2e:
    name: e2e
    runs-on: ubuntu-latest

    # TEMPORARY — non-blocking while the suite is being stabilised against
    # the real wire path (controller -> guard -> interceptor -> filter -> DB).
    # The 7 specs were authored without a local run loop (no Docker on dev
    # machine), so the first CI runs surface assertion bugs that need
    # iterative fixing. Flip this back to fail-the-build once green.
    # Tracked via beads issue projet-ferme-* (see `bd ready`).
    continue-on-error: true

    # Ephemeral Postgres 16 service spun up by GitHub on the runner. Lives
    # for the duration of this job only — no Supabase coupling, no secrets.
    # `--health-cmd` blocks the job until the DB accepts connections so
    # `global-setup.ts` doesn't race against a not-yet-ready container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_compta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_compta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Promoted to DATABASE_URL by test/setup/load-env.ts at jest boot.
      # The other 10+ env vars (JWT_SECRET, MFA_ENCRYPTION_KEY, SMTP_*,
      # …) fall back to deterministic test values defined inside that
      # same file — no need to surface them here.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_compta_test
      TEST_DB_SSL: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend test:e2e

  # ─── Merge gate ──────────────────────────────────────────────────────
  # Aggregates every blocking job. Set this as the SOLE required status
  # check in branch protection — that way adding/removing a leaf job
  # doesn't require touching the protection rule.
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test
      - build-backend
      - lint-frontend
      - typecheck-frontend
      - build-frontend
      - bundle-size
      - api-types-sync
    steps:
      - run: echo "All blocking jobs green."
